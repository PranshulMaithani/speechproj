# ============================================================================
# train_pipeline.py job config (plug-and-play).
#
# Copy this file, tweak the fields, and run:
#     python ec2/train_pipeline.py --config my_job.yaml --out_dir runs/my_job
#
# Any field here is overridable on the CLI, e.g. --seeds 42,43 --epochs 40.
# Anything you omit falls back to train_pipeline.py's DEFAULTS.
# ============================================================================

# ---- paths -----------------------------------------------------------------
# data_dir holds gt.csv (+ feat_* cols) + audio_npy/. Leave the default to use the
# wav-ingest output (data/neural_prep_out/upload); set it for a ready EC2 data dir.
data_dir: /home/ubuntu/nn/data
cache:    ""                              # embeddings_cache.npz; "" -> <data_dir>/embeddings_cache.npz
out_dir:  /home/ubuntu/nn/runs/retrain_20pct
audio_subdir: audio_npy                   # where Stage 0 looks for waveforms

# ---- STAGE I: wav ingest (auto-detect audios<N>/ -> transcribe -> npy + gt) --
# Put audios<N>/ + audios<N>GT.csv in the DATA DIR (where the npy live); auto-detected.
ingest: auto                              # auto (run if new folders/features) | true | false
audio_root: ""                            # "" -> data_dir (audios live WITH the npy); or a path
transcribe_device: cpu                    # cpu | cuda   (cuda = faster transcription)
transcribe_compute_type: int8             # faster-whisper compute type (cuda: float16)
transcribe_model: ""                      # "" keeps the SAME model as audios2..6 (feature parity)
retranscribe: false                       # re-transcribe every discovered batch (--force)
# Nested batches arrive as audios<N>/<ciid>/<ciid>_<q>.wav for q=1..27; the system
# only uses Q25/26/27. keep_questions filters to those (-> npy -> embeddings).
keep_questions: "25,26,27"                # only these qids are processed ("all" = every question)
prune_questions: false                    # DELETE the non-kept wavs to save space (IRREVERSIBLE)

# ---- Stage 0: WavLM/Whisper embedding extraction (guarded, incremental) ------
do_extract: auto                          # auto | true | false
wavlm_id:   microsoft/wavlm-base-plus     # only used if extraction actually runs
whisper_id: openai/whisper-medium

# ---- data selection --------------------------------------------------------
train_batches:      [audios2, audios4, audios5, audios6]
test_batches:       []                    # []  -> 20pct (Mode A) ; [audios6] -> a6 (Mode B)
test_region_filter: ""                    # e.g. PHP to restrict the a6 test set
train_only_batches: [casual]              # auxiliary data forced into TRAIN only
use_augs:           all                   # all | noise,combo,... | "" (no augs)
min_duration:       30.0                  # drop audios shorter than this (sec)
use_text_features:  true                  # include the 55 feat_* handcrafted features
per_client_standardize: false             # center each client's features (unsupervised)

# ---- the variant grid ------------------------------------------------------
# variants: 'all'  -> the canonical 30 (3 archs x 2 layers x 5 PCA)
#           'grid' -> the archs x layers x pca cross product below
#           explicit list -> e.g. [default_last_pca98, tiny_l9_pca95]
variants: [default_last_pca98]
archs:    [default, tiny, linear]         # used only when variants == grid
layers:   [last, "9"]                     # used only when variants == grid
pca:      [full, pca98, pca95, pca93, pca90]   # used only when variants == grid

# ---- seeds (each reshuffles the split AND seeds init) -----------------------
seeds: [42, 43, 44, 45, 46]

# ---- training --------------------------------------------------------------
class_balance: sampler                    # sampler | pos_weight | both | none
batch_size: 64
epochs:     60
lr:         0.001
thr_step:   0.01                          # threshold-workbook granularity
